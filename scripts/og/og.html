<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Geist;src:url('../../public/fonts/Geist-Variable.woff2') format('woff2');font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:rgb(23,20,17);color:rgb(248,246,241);font-family:Geist,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 38%,rgba(182,150,99,.16),transparent 70%)}
.logo{position:absolute;top:44px;left:56px;height:56px;display:flex;align-items:center;gap:14px;font-size:40px;font-weight:500;letter-spacing:-.03em}.bub{height:56px;width:calc(56px*3.241*.41);overflow:hidden}.bub img{height:56px;max-width:none;display:block}
.url{position:absolute;top:58px;right:56px;font-size:24px;font-weight:500;color:rgba(248,246,241,.55)}
.c{position:absolute;left:0;right:0;top:132px;text-align:center}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:136px;line-height:.98;letter-spacing:-.02em}
.chip{display:inline-block;transform:rotate(-1deg);background:rgb(112,93,67);border-radius:24px;padding:.1em .42em;font-family:Geist,sans-serif;font-weight:500;font-size:.62em;letter-spacing:-.04em;outline:2px solid rgba(182,150,99,.35);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 0 40px rgba(182,150,99,.35),0 0 80px rgba(182,150,99,.15)}
p{margin-top:36px;font-size:32px;line-height:1.35;color:rgba(248,246,241,.65)}
p b{font-weight:500;color:rgb(248,246,241)}
</style></head><body>
<div class="glow"></div>
<div class="logo"><div class="bub"><img src="../../public/icons/logo_transparent.png"></div><span>Vocify</span></div>
<div class="url">getvocify.com</div>
<div class="c"><h1>An unfair advantage<br>in every <span class="chip">sale.</span></h1>
<p>We prepare you beforehand, help you during,<br><b>and automate all the admin</b> afterwards.</p></div>
</body></html>
