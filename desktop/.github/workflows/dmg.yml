name: Mac DMG

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  dmg:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Vocify-Companion-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
