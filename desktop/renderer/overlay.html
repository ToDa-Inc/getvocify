<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Vocify Live</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="overlay-body">
    <div class="overlay-shell">
      <div class="overlay-pill">
        <span class="pulse-dot live"></span>
        <div>
          <p class="caps" id="overlay-label">En vivo</p>
          <p class="line" id="overlay-line">Escuchando la reunión…</p>
        </div>
        <button id="overlay-assist" type="button">Ayuda</button>
        <button id="overlay-stop" class="danger" type="button">Parar</button>
      </div>
      <div id="overlay-checklist" class="overlay-checklist" hidden></div>
    </div>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
