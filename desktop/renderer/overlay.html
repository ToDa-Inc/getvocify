<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vocify Live</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="overlay-body">
    <div class="overlay-shell">
      <div class="overlay-pill">
        <span class="pulse-dot live"></span>
        <div>
          <p class="caps" id="overlay-label">Live</p>
          <p class="line" id="overlay-line">Listening to the call…</p>
        </div>
        <button id="overlay-stop" class="danger" type="button">Stop</button>
      </div>
    </div>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
