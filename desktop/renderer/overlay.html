<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Vocify Live</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="overlay-body">
    <div class="overlay-shell">
      <div class="overlay-pill">
        <button id="overlay-stop" class="record-core live" type="button" aria-label="">
          <span class="dot"></span>
        </button>
        <p class="line" id="overlay-line" data-i18n="overlayListening"></p>
        <span id="overlay-checklist" class="overlay-checklist-compact" hidden></span>
        <button id="overlay-assist" class="ghost" type="button" data-i18n="helpOn" hidden></button>
      </div>
      <div id="overlay-checklist-detail" class="overlay-checklist" hidden></div>
    </div>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
