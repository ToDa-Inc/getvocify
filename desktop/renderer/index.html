<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vocify Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./shared/ui/vocify-ui.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="paper-app">
    <div class="title-drag"></div>
    <div class="app-shell">
      <aside id="notes-rail" class="notes-rail" hidden>
        <button id="btn-new-note" class="ghost rail-new" type="button" data-i18n="desktopNewNote"></button>
        <nav id="notes-list" class="notes-list" aria-label="Notas"></nav>
      </aside>
      <main class="app">
        <header class="topbar">
          <div class="brand-lockup">
            <img class="brand-mark" src="./icon.png" alt="Vocify" />
            <span class="wordmark">Vocify</span>
          </div>
          <details id="account-menu" class="account-menu" hidden>
            <summary id="session-chip" class="chip"></summary>
            <button id="btn-dashboard" class="ghost" type="button" data-i18n="desktopOpenDashboard"></button>
            <button id="btn-logout" class="ghost" type="button" data-i18n="desktopLogout"></button>
          </details>
        </header>

        <section id="login-panel" class="card paper">
          <h1>Sign in to <span class="accent">listen</span></h1>
          <label>Email <input id="email" type="email" autocomplete="username" /></label>
          <label>Password <input id="password" type="password" autocomplete="current-password" /></label>
          <button id="btn-login" class="primary" type="button">Log in</button>
          <p id="login-error" class="error" hidden></p>
        </section>

        <section id="listen-panel" hidden>
          <div id="idle-block" class="idle-block">
            <div id="home-hoy" hidden aria-label="Hoy"></div>
            <div id="contact-brief" class="v-paper" hidden></div>
          </div>
          <div id="live-chip" class="live-chip" hidden><span class="pulse-dot live"></span><span id="timer">00:00</span></div>
          <div id="transcript" class="transcript" aria-live="polite"></div>
          <button id="btn-return-live" class="v-transcript-jump ghost" type="button" hidden data-i18n="transcriptBackToLive"></button>
          <p id="assist-line" class="assist-line" hidden></p>
          <div id="live-checklist" class="overlay-checklist" hidden></div>
          <div class="record-row">
            <button id="btn-record" class="record-core" type="button" aria-label=""><span class="dot"></span></button>
            <label id="assist-toggle" class="assist-toggle" hidden><input type="checkbox" id="assist-input" /> <span data-i18n="helpOn"></span></label>
          </div>
          <p id="listen-error" class="error" hidden></p>
          <button id="btn-open-settings" class="ghost" type="button" hidden></button>
        </section>

        <section id="review-panel" hidden>
          <v-followup id="review-followup" hidden></v-followup>
          <div id="review-checklist" class="overlay-checklist card paper" hidden></div>
          <div class="review-grid">
            <div class="card paper">
              <p class="caps">Call notes</p>
              <label>Summary <textarea id="review-summary" rows="8"></textarea></label>
              <label>Next steps <textarea id="review-next" rows="4" placeholder="One per line"></textarea></label>
            </div>
            <div class="card paper">
              <p class="caps">CRM fields</p>
              <p id="review-deal" class="muted"></p>
              <div id="review-deals" class="deal-list" hidden></div>
              <div id="review-fields" class="field-list"></div>
            </div>
          </div>
          <div class="actions">
            <button id="btn-approve" class="primary" type="button">Approve to CRM</button>
            <button id="btn-review-back" class="ghost" type="button">Back to listen</button>
          </div>
          <p id="review-status" class="lede"></p>
          <p id="review-error" class="error" hidden></p>
        </section>
      </main>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
